# Token de GitHub (fine-grained PAT, SOLO permiso "Contents: Read and write"
# sobre Practicas-SA-B-202300670) que el watcher (apps/sa-platform/chart/
# charts/api-gateway/templates/revert-watcher.yaml) usa para llamar a
# POST /repos/.../dispatches y disparar p8-auto-revert.yml cuando el Rollout
# del api-gateway queda Degraded/abortado.
#
# Reemplaza el intento anterior con Argo Rollouts Notifications (ver
# P8/PLAN.md hallazgo #4 y P8/docs/evidencias/): el controller instalado
# (v1.10.0) rechazaba el trigger personalizado con un error de
# "configuration in namespace" no resuelto; esta alternativa (un Pod propio
# que consulta el estado del Rollout via la API de Kubernetes, con RBAC de
# solo lectura) es mas simple de depurar y no depende de esa funcionalidad.
#
# Cifrado con kubeseal contra la clave publica real del controller de Sealed
# Secrets de este cluster - solo ese controller puede descifrarlo; el texto
# de abajo es inutil sin esa clave privada, aun siendo este un repositorio
# publico.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: p8-revert-watcher-secret
  namespace: sa-p8
spec:
  encryptedData:
    github-token: 
  template:
    metadata:
      name: p8-revert-watcher-secret
      namespace: sa-p8

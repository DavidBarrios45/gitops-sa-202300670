# Token de GitHub (fine-grained PAT, SOLO permiso "Contents: Read and write"
# sobre Practicas-SA-B-202300670) que Argo Rollouts Notifications usa para
# llamar a POST /repos/.../dispatches y disparar p8-auto-revert.yml cuando
# el Rollout del api-gateway queda Degraded/abortado (ver P8/PLAN.md
# hallazgo #4). Cifrado con kubeseal contra la clave publica real del
# controller de Sealed Secrets de este cluster - solo ese controller puede
# descifrarlo; el texto de abajo es inutil sin esa clave privada, aun siendo
# este un repositorio publico.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: argo-rollouts-notification-secret
  namespace: sa-p8
spec:
  encryptedData:
    github-token: 
  template:
    metadata:
      name: argo-rollouts-notification-secret
      namespace: sa-p8

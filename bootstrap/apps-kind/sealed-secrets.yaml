# Idéntica a bootstrap/apps/sealed-secrets.yaml (EKS) — sin cambios, se copia
# acá solo para que exista en el árbol de apps-kind/ que usa
# root-app-kind.yaml (path: bootstrap/apps-kind, directory.recurse: false).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets-sa-platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/DavidBarrios45/gitops-sa-202300670.git
    targetRevision: main
    path: secrets
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: sa-p8
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false

# El SealedSecret de la plataforma (secrets/sa-platform-secret.sealedsecret.yaml).
# El controlador de Sealed Secrets en si (CRD + deployment) es un add-on
# instalado imperativamente en el bootstrap de dia-0, no gestionado por ArgoCD
# (ver P8/PLAN.md Fase 3). cosign.pub vive en el mismo directorio pero no es
# un manifiesto de Kubernetes, asi que ArgoCD lo ignora al sincronizar.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets-sa-platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/DavidBarrios45/gitops-sa-202300670.git
    targetRevision: main
    path: secrets
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: sa-p8
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false

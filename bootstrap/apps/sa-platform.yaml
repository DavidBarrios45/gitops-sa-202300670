apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sa-platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/DavidBarrios45/gitops-sa-202300670.git
    targetRevision: main
    path: apps/sa-platform/chart
    helm:
      valueFiles:
        - values.yaml
        - values-eks.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: sa-p8
  # verify-image-signature (Kyverno) mutateDigest:true fija el digest
  # completo en cada Pod admitido (imagen:tag@sha256:...) - Git solo
  # declara imagen:tag (el PR automatico nunca escribe el digest en el
  # chart, ver values-eks.yaml). Sin esto ArgoCD veria drift permanente:
  # selfHeal revertiria al valor de Git, Kyverno lo volveria a mutar en
  # el proximo Pod admitido, en bucle. Se le pide a ArgoCD ignorar
  # unicamente el campo image del contenedor al diffear.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jqPathExpressions:
        - '.spec.template.spec.containers[].image'
        # Los servicios Node con Prisma (auth/catalogo/pedidos) usan un
        # initContainer "prisma-migrate" con la MISMA imagen del
        # contenedor principal (ver _deployment.tpl) - tambien recibe el
        # digest mutado por Kyverno.
        - '.spec.template.spec.initContainers[].image'
    - group: batch
      kind: CronJob
      jqPathExpressions:
        - '.spec.jobTemplate.spec.template.spec.containers[].image'
        - '.spec.jobTemplate.spec.template.spec.initContainers[].image'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false

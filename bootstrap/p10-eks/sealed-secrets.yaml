# Mismo SealedSecret de la plataforma que usa P9 (secrets/, solo lectura: NO se modifica). En EKS se descifra con
# la llave restaurada del respaldo (--restore-secrets del bootstrap). El controlador de Sealed Secrets es un
# add-on de Terraform, no de ArgoCD.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets-sa-platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/DavidBarrios45/gitops-sa-202300670.git
    targetRevision: main
    path: secrets
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: sa-p8
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false

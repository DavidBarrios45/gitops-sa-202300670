# App-of-apps de la Practica 10 (observabilidad). Es INDEPENDIENTE de root-app.yaml /
# root-app-kind.yaml (P8/P9): apunta a bootstrap/p10/, una ruta que esos root-app no
# recorren (recurse: false), asi P9 se despliega y se califica sin cargar este stack.
# Se aplica a mano:  kubectl apply -f bootstrap/root-app-p10.yaml
# Igual para kind y EKS (los manifiestos de bootstrap/p10/ no cambian entre entornos).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app-p10
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/DavidBarrios45/gitops-sa-202300670.git
    targetRevision: main
    path: bootstrap/p10
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false

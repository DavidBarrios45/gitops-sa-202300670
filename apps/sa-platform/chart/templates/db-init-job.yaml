apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-db-init
  labels:
    {{- include "sa-platform.labels" . | nindent 4 }}
  annotations:
    # Hook post-install/post-upgrade: corre DESPUÉS de que Postgres ya existe.
    # 'before-hook-creation' borra el Job anterior para poder re-ejecutarlo en cada upgrade.
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        {{- include "sa-platform.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ .Release.Name }}-db-init
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70          # usuario 'postgres' en la imagen alpine
        fsGroup: 70
      containers:
        - name: db-init
          image: "postgres:16-alpine"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "25m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
          env:
            - name: HOME
              value: /tmp
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "sa-platform.secretName" . }}
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "sa-platform.secretName" . }}
                  key: POSTGRES_PASSWORD
          command:
            - sh
            - -c
            - |
              set -e
              HOST={{ include "sa-platform.postgresHost" . }}
              echo "Esperando a PostgreSQL en $HOST..."
              until pg_isready -h "$HOST" -U "$POSTGRES_USER"; do sleep 2; done
              for db in auth_db catalogo_db pedidos_db pagos_db clientes_db cron_db; do
                if psql -h "$HOST" -U "$POSTGRES_USER" -d postgres -tAc \
                     "SELECT 1 FROM pg_database WHERE datname='$db'" | grep -q 1; then
                  echo "  $db ya existe"
                else
                  echo "  creando $db"
                  psql -h "$HOST" -U "$POSTGRES_USER" -d postgres -c "CREATE DATABASE \"$db\""
                fi
              done
              echo "Bases lógicas listas."
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

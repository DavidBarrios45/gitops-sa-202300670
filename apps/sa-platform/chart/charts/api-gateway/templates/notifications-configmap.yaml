# Argo Rollouts Notifications (motor compartido con ArgoCD notifications):
# cuando el Rollout del api-gateway queda "Degraded" por un abort (condicion
# real verificada: status.conditions[].reason == "RolloutAborted", ver
# P8/docs/evidencias/canary-reversion-automatica/), dispara un webhook hacia
# GitHub (repository_dispatch) que arranca p8-auto-revert.yml.
#
# Por que esto vive DENTRO del cluster y no en un workflow: ningun workflow
# de GitHub Actions tiene credenciales para leer el estado del cluster (ver
# P8/PLAN.md, principio rector) - el cluster es quien tiene que avisar hacia
# afuera, nunca al reves. El token que autoriza esa llamada vive cifrado como
# SealedSecret (secrets/argo-rollouts-notification-secret.sealedsecret.yaml),
# nunca en texto plano, aunque este repositorio sea publico.
# NOTA: este ConfigMap y su Secret (../../../../secrets/) viven en el
# namespace "argo-rollouts" (el del controller), NO en "sa-p8" como el resto
# del chart - verificado empiricamente contra los logs del controller
# ("invalidated cache for resource in namespace: argo-rollouts with the
# name: argo-rollouts-notification-secret"): en modo cluster-wide (no
# --namespaced), Argo Rollouts busca su config de notificaciones en su
# propio namespace, no en el del Rollout que dispara el evento.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argo-rollouts-notification-configuration
  namespace: argo-rollouts
data:
  service.webhook.github-revert: |
    url: https://api.github.com/repos/DavidBarrios45/Practicas-SA-B-202300670/dispatches
    headers:
      - name: Accept
        value: application/vnd.github+json
      - name: Authorization
        value: token $github-token
      - name: X-GitHub-Api-Version
        value: "2022-11-28"

  template.rollout-degraded: |
    webhook:
      github-revert:
        method: POST
        body: |
          {
            "event_type": "p8-rollout-degraded",
            "client_payload": {
              "rollout": "{{ "{{.rollout.metadata.name}}" }}",
              "namespace": "{{ "{{.rollout.metadata.namespace}}" }}"
            }
          }

  # Condicion verificada empiricamente contra un abort real (ver evidencia
  # arriba): al abortar, Argo Rollouts agrega a status.conditions una entrada
  # type=Progressing, reason=RolloutAborted.
  trigger.on-rollout-degraded-github: |
    - when: "any(rollout.status.conditions, {.reason == 'RolloutAborted'})"
      send: [rollout-degraded]

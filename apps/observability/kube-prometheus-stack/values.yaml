# P10 Fase 1 - Prometheus + Alertmanager + Grafana + exporters.
# Sin PVC (emptyDir) y retencion corta: es un stack de demostracion; el estado util
# (reglas, dashboards, datasources) vive en Git, no en disco.
fullnameOverride: kps
defaultRules:
  create: true
  rules:
    etcd: false
    kubeSchedulerAlerting: false
    kubeControllerManager: false
    kubeProxy: false
# kind/EKS administrado no exponen estos componentes del control plane
kubeEtcd: { enabled: false }
kubeScheduler: { enabled: false }
kubeControllerManager: { enabled: false }
kubeProxy: { enabled: false }

prometheus:
  prometheusSpec:
    retention: 2d
    # Descubre ServiceMonitor/PodMonitor/PrometheusRule de cualquier release/namespace
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    # El OTel Collector envia las metricas de aplicacion por remote write
    enableRemoteWriteReceiver: true
    enableFeatures: [exemplar-storage]
    resources:
      requests: { cpu: 100m, memory: 400Mi }
      limits: { cpu: "1", memory: 1Gi }

alertmanager:
  # Enrutado (D3): solo las alertas de SLO (etiqueta "slo") llegan al webhook; el resto de alertas por defecto
  # de kube-prometheus-stack va a "null" para no mezclar ruido de plataforma con las alertas de servicio.
  config:
    global: { resolve_timeout: 5m }
    inhibit_rules:
      # Si ya se esta paginando por un SLO, su version lenta (ticket) es redundante.
      - source_matchers: ['accion = pagina']
        target_matchers: ['accion = ticket']
        equal: ['slo']
    route:
      receiver: "null"
      group_by: ['alertname', 'slo']
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 12h
      routes:
        - receiver: webhook-p10
          matchers: ['slo =~ ".+"']
          repeat_interval: 1h
    receivers:
      - name: "null"
      - name: webhook-p10
        webhook_configs:
          - url: http://alert-receiver.observability.svc:8080/alerta
            send_resolved: true
  alertmanagerSpec:
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { cpu: 100m, memory: 128Mi }

grafana:
  adminPassword: p10-observabilidad   # solo demo local; no es un secreto real
  defaultDashboardsTimezone: America/Guatemala
  # Fase 9: con 500m Grafana 13 quedaba estrangulado (87 % de throttling) y su API tardaba >30 s con ~25 dashboards.
  resources:
    requests: { cpu: 200m, memory: 256Mi }
    limits: { cpu: 1500m, memory: 768Mi }
  sidecar:
    dashboards: { enabled: true, searchNamespace: ALL }
    datasources: { enabled: true, searchNamespace: ALL }
  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      url: http://loki.observability.svc:3100
      jsonData:
        derivedFields:
          - name: trace_id
            matcherRegex: '"trace_id":\s*"(\w+)"'
            matcherType: regex
            url: '$${__value.raw}'
            urlDisplayLabel: Ver traza en Tempo
            datasourceUid: tempo
    - name: Tempo
      uid: tempo
      type: tempo
      url: http://tempo.observability.svc:3200
      jsonData:
        # Traza -> logs: el stream de Loki no lleva el servicio como etiqueta util (service_name=sa-platform),
        # asi que se usa una consulta propia: todos los logs del namespace con ese trace_id en la linea JSON.
        tracesToLogsV2:
          datasourceUid: loki
          spanStartTimeShift: '-2m'
          spanEndTimeShift: '2m'
          filterByTraceID: false
          filterBySpanID: false
          customQuery: true
          query: '{k8s_namespace_name="sa-p8"} |= "$${__trace.traceId}"'
        nodeGraph: { enabled: true }
        serviceMap:
          datasourceUid: prometheus

prometheusOperator:
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits: { cpu: 200m, memory: 200Mi }
kube-state-metrics:
  resources:
    requests: { cpu: 10m, memory: 48Mi }
    limits: { cpu: 100m, memory: 128Mi }
prometheus-node-exporter:
  resources:
    requests: { cpu: 10m, memory: 24Mi }
    limits: { cpu: 100m, memory: 64Mi }

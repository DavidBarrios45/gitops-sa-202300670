# P10 Fase 1 - Tempo en modo binario unico; recibe OTLP del Collector.
tempo:
  retention: 24h
  receivers:
    otlp:
      protocols:
        grpc: { endpoint: "0.0.0.0:4317" }
        http: { endpoint: "0.0.0.0:4318" }
  resources:
    # Fase 8: con el generador de carga (~12 req/s) 512Mi producia OOMKilled (7 reinicios) y, sin volumen,
    # cada reinicio borraba las trazas (se perdian las del incidente). Mas memoria + PVC.
    requests: { cpu: 100m, memory: 400Mi }
    limits: { cpu: 500m, memory: 1Gi }
persistence: { enabled: true, size: 4Gi }

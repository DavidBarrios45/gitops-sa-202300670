# Metricas de ingress-nginx (nginx_ingress_controller_*), base del canary por metricas (D7).
# El puerto "metrics" lo habilita Terraform (controller.metrics.enabled=true).
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: ingress-nginx
  namespace: observability
spec:
  namespaceSelector: { matchNames: [ingress-nginx] }
  selector:
    matchLabels:
      app.kubernetes.io/name: ingress-nginx
      app.kubernetes.io/component: controller
  podMetricsEndpoints:
    - port: metrics
      interval: 15s

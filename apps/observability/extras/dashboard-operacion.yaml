# P10 Fase 9 - Tablero de operacion (4 senales de oro + SLO + despliegue). Generado por P10/grafana/generar-tablero.py.
# El sidecar de Grafana (searchNamespace: ALL) carga todo ConfigMap con la etiqueta grafana_dashboard.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-operacion-p10
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  p10-operacion.json: |
    {
      "uid": "p10-operacion",
      "title": "P10 - Operación de SA Platform (4 señales de oro)",
      "tags": [
        "p10",
        "slo",
        "operacion"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "editable": true,
      "graphTooltip": 1,
      "description": "Tablero de operación: cada panel responde una pregunta concreta. Filas: SLO/negocio, tráfico, errores, latencia, saturación y despliegue.",
      "annotations": {
        "list": [
          {
            "name": "Alertas de SLO",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "enable": true,
            "iconColor": "red",
            "expr": "ALERTS{alertstate=\"firing\",slo!=\"\"}",
            "titleFormat": "{{alertname}}",
            "textFormat": "{{summary}}",
            "step": "60s"
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "¿Estamos cumpliendo lo que prometemos? (SLO y negocio)",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 2,
          "type": "stat",
          "title": "¿Cuánto presupuesto de error de disponibilidad queda?",
          "description": "SLO-1: 99.5 % de peticiones al gateway sin 5xx (28 d). Verde = holgura; rojo < 10 %: congelar cambios riesgosos.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "slo:availability:error_budget_remaining_ratio",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.1
                  },
                  {
                    "color": "green",
                    "value": 0.5
                  }
                ]
              },
              "noValue": "sin datos"
            },
            "overrides": []
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "¿Cuánto presupuesto de latencia de crearPedido queda?",
          "description": "SLO-2: 95 % de crearPedido en < 500 ms (28 d).",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 4,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "slo:crearpedido:error_budget_remaining_ratio",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.1
                  },
                  {
                    "color": "green",
                    "value": 0.5
                  }
                ]
              },
              "noValue": "sin datos"
            },
            "overrides": []
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "¿Hay alguien a quien despertar?",
          "description": "Alertas de PÁGINA de SLO activas. Distinto de 0 = abrir el runbook de la alerta (anotación runbook_url).",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 8,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "count(ALERTS{alertstate=\"firing\",slo!=\"\",accion=\"pagina\"}) or vector(0)",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "noValue": "sin datos"
            },
            "overrides": []
          }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "¿Cuántos pedidos se crean por hora?",
          "description": "Métrica de negocio: pedidos_creados_total. Una caída brusca con tráfico estable = el flujo de compra está roto aunque no haya 5xx.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(increase(pedidos_creados_total[1h]))",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "noValue": "sin datos",
              "decimals": 0
            },
            "overrides": []
          }
        },
        {
          "id": 6,
          "type": "stat",
          "title": "¿Qué porcentaje de pagos se rechaza?",
          "description": "Métrica de negocio: pagos_rechazados_total / pagos_procesados_total (1 h). El generador de carga fuerza ~25 % de rechazos; en producción un salto indicaría un fallo del cobro.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 16,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(increase(pagos_rechazados_total[1h])) / clamp_min(sum(increase(pagos_procesados_total[1h])), 1)",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.4
                  },
                  {
                    "color": "red",
                    "value": 0.7
                  }
                ]
              },
              "noValue": "sin datos"
            },
            "overrides": []
          }
        },
        {
          "id": 7,
          "type": "stat",
          "title": "¿Hay un despliegue (canary) en curso?",
          "description": "1 = solo la versión estable recibe tráfico; 2 = hay una candidata recibiendo tráfico (ver la fila de despliegue).",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 20,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "count(sum by (k8s_replicaset_name) (rate(http_server_request_duration_seconds_count{service_name=\"api-gateway\"}[1m])) > 0)",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "blue",
                    "value": 2
                  }
                ]
              },
              "noValue": "sin datos",
              "decimals": 0
            },
            "overrides": []
          }
        },
        {
          "id": 8,
          "type": "row",
          "title": "Tráfico — ¿cuánta gente nos usa?",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 5,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "¿Cuántas peticiones por segundo recibe cada ruta del gateway?",
          "description": "Tráfico visto por el pod (gateway). Un cambio de forma sin cambio de carga sugiere un cliente roto.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 6,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (http_route) (rate(http_server_request_duration_seconds_count{service_name=\"api-gateway\"}[1m]))",
              "legendFormat": "{{http_route}}",
              "refId": "A"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 15,
                "showPoints": "never",
                "stacking": {
                  "mode": "normal"
                },
                "thresholdsStyle": {
                  "mode": "off"
                }
              },
              "noValue": "sin datos"
            },
            "overrides": []
          }
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "¿Qué recibe el usuario desde el ingress, por clase de respuesta?",
          "description": "Visto desde fuera del pod (nginx-ingress): incluye timeouts/504 que el pod no alcanza a medir.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 6,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (clase) (label_replace(rate(nginx_ingress_controller_requests[1m]), \"clase\", \"${1}xx\", \"status\", \"(.).*\"))",
              "legendFormat": "{{clase}}",
              "refId": "A"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 15,
                "showPoints": "never",
                "stacking": {
                  "mode": "normal"
                },
                "thresholdsStyle": {
                  "mode": "off"
                }
              },
              "noValue": "sin datos"
            },
            "overrides": []
          }
        },
        {
          "id": 11,
          "type": "row",
          "title": "Errores — ¿qué falla y a qué velocidad gastamos el presupuesto?",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 14,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 12,
          "type": "timeseries",
          "title": "¿Qué rutas del gateway devuelven 5xx?",
          "description": "Fracción de 5xx por ruta. La ruta con más error señala el servicio destino a investigar (502 = el proxy no lo alcanzó).",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 15,
            "w": 8,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (http_route) (rate(http_server_request_duration_seconds_count{service_name=\"api-gateway\",http_response_status_code=~\"5..\"}[1m])) / sum by (http_route) (rate(http_server_request_duration_seconds_count{service_name=\"api-gateway\"}[1m]))",
              "legendFormat": "{{http_route}}",
              "refId": "A"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 8,
                "showPoints": "never",
                "stacking": {
                  "mode": "none"
                },
                "thresholdsStyle": {
                  "mode": "off"
                }
              },
              "noValue": "sin datos",
              "min": 0
            },
            "overrides": []
          }
        },
        {
          "id": 13,
          "type": "timeseries",
          "title": "¿Qué dependencia falla desde el gateway?",
          "description": "5xx de las llamadas salientes del gateway por servicio destino (peer).",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 8,
            "y": 15,
            "w": 8,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (peer) (rate(http_client_request_duration_seconds_count{service_name=\"api-gateway\",http_response_status_code=~\"5..\"}[1m]))",
              "legendFormat": "{{peer}}",
              "refId": "A"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 8,
                "showPoints": "never",
                "stacking": {
                  "mode": "none"
                },
                "thresholdsStyle": {
                  "mode": "off"
                }
              },
              "noValue": "sin datos",
              "min": 0
            },
            "overrides": []
          }
        },
        {
          "id": 14,
          "type": "timeseries",
          "title": "¿Qué tan rápido gastamos el presupuesto de error?",
          "description": "Burn rate = error observado / error tolerable. 14.4× sostenido (ventanas 1 h y 5 min) dispara la página; 6× abre ticket.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 16,
            "y": 15,
            "w": 8,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "slo:availability:burn_rate5m",
              "legendFormat": "disponibilidad 5m",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "slo:availability:burn_rate1h",
              "legendFormat": "disponibilidad 1h",
              "refId": "B"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "slo:crearpedido:burn_rate30m",
              "legendFormat": "crearPedido 30m",
              "refId": "C"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "slo:crearpedido:burn_rate5m",
              "legendFormat": "crearPedido 5m",
              "refId": "D"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 8,
                "showPoints": "never",
                "stacking": {
                  "mode": "none"
                },
                "thresholdsStyle": {
                  "mode": "line"
                }
              },
              "noValue": "sin datos",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 6
                  },
                  {
                    "color": "red",
                    "value": 14.4
                  }
                ]
              },
              "min": 0
            },
            "overrides": []
          }
        },
        {
          "id": 15,
          "type": "row",
          "title": "Latencia — ¿qué tan lento lo percibe el usuario?",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 23,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 16,
          "type": "timeseries",
          "title": "¿Qué tan lento responde el gateway (p50 / p95 / p99)?",
          "description": "Latencia del gateway medida en el pod. p99 muy por encima de p95 = unas pocas peticiones lentas (cola larga).",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 24,
            "w": 8,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "histogram_quantile(0.50, sum by (le) (rate(http_server_request_duration_seconds_bucket{service_name=\"api-gateway\"}[1m])))",
              "legendFormat": "p50",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_seconds_bucket{service_name=\"api-gateway\"}[1m])))",
              "legendFormat": "p95",
              "refId": "B"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "histogram_quantile(0.99, sum by (le) (rate(http_server_request_duration_seconds_bucket{service_name=\"api-gateway\"}[1m])))",
              "legendFormat": "p99",
              "refId": "C"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 8,
                "showPoints": "never",
                "stacking": {
                  "mode": "none"
                },
                "thresholdsStyle": {
                  "mode": "off"
                }
              },
              "noValue": "sin datos",
              "min": 0
            },
            "overrides": []
          }
        },
        {
          "id": 17,
          "type": "timeseries",
          "title": "¿crearPedido sigue por debajo de 500 ms?",
          "description": "p95 de la mutación crearPedido (base del SLO-2). La línea roja es el límite del SLO.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 8,
            "y": 24,
            "w": 8,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "histogram_quantile(0.95, sum by (le) (rate(graphql_operation_duration_seconds_bucket{operation=\"crearPedido\"}[5m])))",
              "legendFormat": "p95 crearPedido",
              "refId": "A"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 8,
                "showPoints": "never",
                "stacking": {
                  "mode": "none"
                },
                "thresholdsStyle": {
                  "mode": "line"
                }
              },
              "noValue": "sin datos",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 0.5
                  }
                ]
              },
              "min": 0
            },
            "overrides": []
          }
        },
        {
          "id": 18,

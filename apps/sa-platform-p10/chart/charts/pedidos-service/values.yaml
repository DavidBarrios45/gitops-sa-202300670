# Valores del subchart pedidos-service. El Deployment lo genera el molde compartido.
image:
  repository: sa/pedidos-service
  tag: dev
  pullPolicy: IfNotPresent

replicas: 1

service:
  type: ClusterIP
  port: 3003

features:
  database: pedidos_db
  prismaMigrate: true
  healthCheck: http
  healthPath: /health

env: {}

resources:
  requests:
    cpu: "50m"
    memory: "64Mi"
  limits:
    cpu: "250m"
    memory: "256Mi"

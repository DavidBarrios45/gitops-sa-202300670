apiVersion: v1
kind: Service
metadata:
  name: {{ include "sa-platform.fullname" . }}
  labels:
    {{- include "sa-platform.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type | default "ClusterIP" }}
  selector:
    {{- include "sa-platform.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP

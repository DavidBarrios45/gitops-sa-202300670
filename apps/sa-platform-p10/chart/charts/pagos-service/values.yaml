# Valores del subchart pagos-service. El Deployment lo genera el molde compartido.
image:
  repository: sa/pagos-service
  tag: dev
  pullPolicy: IfNotPresent

replicas: 1

service:
  type: ClusterIP
  port: 3004

features:
  database: pagos_db
  prismaMigrate: false
  healthCheck: http
  healthPath: /health

env: {}

resources:
  requests:
    cpu: "50m"
    memory: "64Mi"
  limits:
    cpu: "250m"
    memory: "256Mi"

# Valores del subchart api-gateway.
# El Rollout/Deployment lo genera el molde compartido (ver rollout.yaml y
# deployment.yaml — uno u otro se activa según rollout.enabled).
image:
  repository: sa/api-gateway
  tag: dev
  pullPolicy: IfNotPresent

replicas: 2

# P9: anti-afinidad entre nodos (ver sa-platform.podTemplate). Solo el
# api-gateway: es el punto de entrada del tráfico y el servicio que la prueba
# de drenaje de nodo (Fase 4) mantiene respondiendo.
podAntiAffinity:
  enabled: true

# P9: segundos que el pod sigue sirviendo tras recibir la orden de cierre
# (preStop). Evita errores de conexión durante un drenaje de nodo.
preStopSleepSeconds: 10

service:
  type: ClusterIP
  port: 8080

# El gateway NO tiene base de datos ni Prisma. Desde P8 expone GET /health
# propio (antes usaba probe TCP): lo golpean el AnalysisTemplate del canary
# y las pruebas de humo.
features:
  database: ""
  prismaMigrate: false
  healthCheck: http
  healthPath: /health

# Modo de fallo inducido (P8): "" (normal) | "error" | "latency".
# Se sobreescribe únicamente en values-defectuoso.yaml para la demo del
# informe de incidente — nunca en values-eks.yaml.
faultMode: ""

# Ingress: única puerta de entrada. host vacío => responde en cualquier host
# (p. ej. http://localhost/). path / => todo el tráfico va al gateway.
# Con rollout.enabled=true, este es el Ingress "estable"
# (trafficRouting.nginx.stableIngress en rollout.yaml) — Argo Rollouts crea
# y gestiona el Ingress canario automáticamente a partir de este mismo.
ingress:
  enabled: true
  className: nginx
  host: ""
  path: /
  annotations: {}

# HPA (heredado de P5-P7): SOLO se usa si rollout.enabled=false. Durante un
# canary con trafficRouting, el peso de tráfico no depende del número de
# réplicas — el HPA pelearía con Rollouts por spec.replicas y arruinaría el
# análisis (ver P8/PLAN.md hallazgo #3), por eso el molde exige AMBAS
# condiciones antes de crear el HPA.
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 40

# Entrega progresiva (P8, Argo Rollouts). Ver charts/api-gateway/templates/
# rollout.yaml y analysistemplate.yaml.
rollout:
  enabled: true
  # 4 pasos de promoción (excede el mínimo de 3 que pide el enunciado), cada uno
  # seguido de un análisis por MÉTRICAS de Prometheus (P10, ver analysistemplate.yaml).
  steps:
    - weight: 20
    - weight: 50
    - weight: 80
    - weight: 100
  analysis:
    # P10: el análisis consulta Prometheus sobre la versión candidata (sin Job de k6).
    prometheusAddress: http://kps-prometheus.observability.svc:9090
    # Umbrales justificados con la línea base medida (p95 ~25 ms, 0 errores 5xx):
    #   - errorRateThreshold: 1 % = el doble del presupuesto del SLO-1 (0.5 %); con ~2 req/s
    #     hacia el canary, un 5xx aislado no aborta (failureLimit) pero dos sí.
    #   - p95ThresholdSeconds: 250 ms = la mitad del límite del SLO-2 (500 ms): detiene
    #     una regresión antes de que consuma presupuesto de error.
    errorRateThreshold: "0.01"
    p95ThresholdSeconds: "0.25"
    # initialDelay: deja que el candidato reciba tráfico y exporte métricas (OTel ~15 s).
    # interval x count: 4 muestras cada 20 s => ~2 min de evidencia por paso.
    # failureLimit 1: tolera una muestra ruidosa; la segunda fallida aborta el canary.
    initialDelay: 45s
    interval: 20s
    count: 4
    failureLimit: 1

env: {}

resources:
  requests:
    cpu: "50m"
    memory: "64Mi"
  limits:
    cpu: "250m"
    memory: "256Mi"

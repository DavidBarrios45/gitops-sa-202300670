{{- if .Values.rollout.enabled }}
# ============================================================================
# AnalysisTemplate (P10): el canary se decide con METRICAS REALES de Prometheus,
# ya no con un Job sintetico de k6 (cierra el pendiente deliberado de P8).
#
# Que mide: SOLO la version candidata. Las metricas OpenTelemetry del api-gateway
# llevan la etiqueta k8s_replicaset_name; el ReplicaSet del canary se llama
# "<rollout>-<pod-template-hash>" y Argo Rollouts entrega ese hash en el arg
# "canary-hash" (valueFrom.podTemplateHashValue: Latest, ver rollout.yaml). Asi la
# consulta ve exactamente el trafico que el ingress reparte al canary y no el total.
# El trafico lo mantiene el generador de carga (observability/load-generator),
# separado de este analisis (D5).
#
# Decision: tasa de error 5xx < 1 % (el doble del presupuesto del SLO-1, 0.5 %) y
# p95 < 250 ms (linea base medida ~25 ms; la mitad del limite de 500 ms del SLO-2,
# para detener una regresion antes de que consuma presupuesto). Si una consulta
# falla "failureLimit" veces el AnalysisRun queda Failed -> Rollout Degraded ->
# aborto automatico (peso 0, todo el trafico al stable).
# ============================================================================
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: {{ include "sa-platform.fullname" . }}-canary-metrics
  labels:
    {{- include "sa-platform.labels" . | nindent 4 }}
spec:
  args:
    # Pod-template-hash del ReplicaSet candidato (lo inyecta el Rollout).
    - name: canary-hash
  metrics:
    - name: error-rate
      # Espera a que el candidato reciba trafico y exporte sus primeras muestras
      # (el SDK de OTel exporta cada ~15 s hacia el Collector y Prometheus).
      initialDelay: {{ .Values.rollout.analysis.initialDelay | quote }}
      interval: {{ .Values.rollout.analysis.interval | quote }}
      count: {{ .Values.rollout.analysis.count }}
      failureLimit: {{ .Values.rollout.analysis.failureLimit }}
      # Sin muestras (resultado vacio) NO es exito: cuenta como error de
      # medicion y, tras consecutiveErrorLimit, el paso falla.
      consecutiveErrorLimit: 3
      successCondition: "result[0] < {{ .Values.rollout.analysis.errorRateThreshold }}"
      failureCondition: "result[0] >= {{ .Values.rollout.analysis.errorRateThreshold }}"
      provider:
        prometheus:
          address: {{ .Values.rollout.analysis.prometheusAddress }}
          query: |
            (
              sum(rate(http_server_request_duration_seconds_count{service_name="api-gateway",k8s_replicaset_name="{{ include "sa-platform.fullname" . }}-{{ `{{args.canary-hash}}` }}",http_response_status_code=~"5.."}[1m]))
              or vector(0)
            )
            /
            sum(rate(http_server_request_duration_seconds_count{service_name="api-gateway",k8s_replicaset_name="{{ include "sa-platform.fullname" . }}-{{ `{{args.canary-hash}}` }}"}[1m]))
    - name: latency-p95
      initialDelay: {{ .Values.rollout.analysis.initialDelay | quote }}
      interval: {{ .Values.rollout.analysis.interval | quote }}
      count: {{ .Values.rollout.analysis.count }}
      failureLimit: {{ .Values.rollout.analysis.failureLimit }}
      consecutiveErrorLimit: 3
      successCondition: "result[0] < {{ .Values.rollout.analysis.p95ThresholdSeconds }}"
      failureCondition: "result[0] >= {{ .Values.rollout.analysis.p95ThresholdSeconds }}"
      provider:
        prometheus:
          address: {{ .Values.rollout.analysis.prometheusAddress }}
          query: |
            histogram_quantile(0.95,
              sum by (le) (rate(http_server_request_duration_seconds_bucket{service_name="api-gateway",k8s_replicaset_name="{{ include "sa-platform.fullname" . }}-{{ `{{args.canary-hash}}` }}"}[1m]))
            )
{{- end }}

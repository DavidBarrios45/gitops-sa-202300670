{{- if .Values.ingress.enabled }}
# ============================================================================
# Ingress: ÚNICA puerta de entrada al clúster (bloque E). Manda todo el tráfico
# (path /) al Service del gateway, que enruta internamente por prefijo.
# ============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "sa-platform.fullname" . }}
  labels:
    {{- include "sa-platform.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className | default "nginx" }}
  rules:
    {{- if .Values.ingress.host }}
    - host: {{ .Values.ingress.host | quote }}
      http:
    {{- else }}
    - http:
    {{- end }}
        paths:
          - path: {{ .Values.ingress.path | default "/" }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "sa-platform.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}
